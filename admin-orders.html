<div class="admin-content">
  <div class="admin-panel">
    <div class="admin-panel-head"><h2>All Orders</h2></div>
    <div class="admin-search-row">
      <input type="text" id="aoSearch" placeholder="Search by order number...">
      <select id="aoStatusFilter"><option value="">All Statuses</option><option value="new">New</option><option value="processing">Processing</option><option value="paid">Paid</option><option value="preparing">Preparing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select>
    </div>
    <table class="admin-table">
      <tr><th>Order</th><th>Items</th><th>Amount</th><th>Status</th><th>Tracking #</th><th>Date</th><th></th></tr>
      <tbody id="aoRows"><tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:30px;">Loading orders…</td></tr></tbody>
    </table>
  </div>
</div>

</div>
<script>
  // Anything that came from the database is turned into plain text before it is
  // placed on the page, so a customer-typed name can never run as code.
  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const STATUS_OPTIONS = ["new", "processing", "paid", "preparing", "shipped", "delivered", "cancelled"];
  let allOrders = [];

  document.addEventListener("adminReady", async () => {
    await loadOrders();
    document.getElementById("aoSearch").addEventListener("input", renderOrders);
    document.getElementById("aoStatusFilter").addEventListener("change", renderOrders);
  });

  async function loadOrders() {
    const { data, error } = await supabaseClient
      .from("orders")
      .select("*, order_items(id)")
      .order("created_at", { ascending: false });
    if (error) {
      document.getElementById("aoRows").innerHTML = `<tr><td colspan="7" style="text-align:center;color:#B23A3A;padding:30px;">Couldn't load orders.</td></tr>`;
      console.error(error);
      return;
    }
    allOrders = data || [];
    renderOrders();
  }


  // Asks whether to email the customer, then asks the secure sender to do it. The status has
  // already been saved by this point, so declining just means no email.
  async function offerCustomerEmail(order, event) {
    const typed = document.querySelector(`.ao-tracking-input[data-id="${order.id}"]`);
    const hasTracking = ((typed && typed.value) || order.tracking_number || "").trim();
    let question = `Email the customer that order ${order.order_number} has ${event === "shipped" ? "shipped" : "been delivered"}?`;
    if (event === "shipped" && !hasTracking) question += "\n\nThere's no tracking number on this order yet, so the email won't include one.";
    if (!confirm(question)) return;
    const { data } = await supabaseClient.auth.getSession();
    if (!data || !data.session) { alert("You're not signed in any more — please log in again."); return; }
    try {
      const res = await fetch(supabaseClient.supabaseUrl + "/functions/v1/order-status-email", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: supabaseClient.supabaseKey, Authorization: "Bearer " + data.session.access_token },
        body: JSON.stringify({ orderNumber: order.order_number, event }),
      });
      const j = (await res.json().catch(() => null)) || {};
      if (res.ok && j.ok && j.sent) alert(`Email sent to ${j.sent_to}.`);
      else if (res.ok && j.ok) alert(j.reason || "Nothing was sent.");
      else alert((j.error || "The email couldn't be sent.") + " The order status was still saved.");
    } catch (e) { alert("Couldn't reach the email sender. The order status was still saved."); }
  }

  function renderOrders() {
    const search = document.getElementById("aoSearch").value.toLowerCase();
    const status = document.getElementById("aoStatusFilter").value;
    const filtered = allOrders.filter((o) => {
      if (status && o.status !== status) return false;
      if (search && !String(o.order_number).toLowerCase().includes(search)) return false;
      return true;
    });

    const tbody = document.getElementById("aoRows");
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:30px;">No orders found.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map((o) => `
      <tr>
        <td>${esc(o.order_number)}</td>
        <td>${(o.order_items || []).length}</td>
        <td>₦${Number(o.total).toLocaleString()}</td>
        <td>
          <select class="ao-status-select" data-id="${esc(o.id)}" style="padding:4px 8px;border-radius:20px;border:1px solid var(--line);font-size:0.78rem;">
            ${STATUS_OPTIONS.map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join("")}
          </select>
        </td>
        <td>
          <input type="text" class="ao-tracking-input" data-id="${esc(o.id)}" value="${esc(o.tracking_number || "")}" placeholder="Add tracking #" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:0.78rem;width:110px;">
        </td>
        <td>${new Date(o.created_at).toLocaleDateString()}</td>
        <td class="admin-table-actions"></td>
      </tr>`).join("");

    tbody.querySelectorAll(".ao-status-select").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const { error } = await supabaseClient.from("orders").update({ status: sel.value }).eq("id", sel.dataset.id);
        if (error) { alert("Couldn't update status — please try again."); console.error(error); return; }
        const order = allOrders.find((o) => o.id === sel.dataset.id);
        if (order) order.status = sel.value;
        // Shipped and delivered are the two moments a customer wants to hear from you.
        if (order && (sel.value === "shipped" || sel.value === "delivered")) await offerCustomerEmail(order, sel.value);
      });
    });

    tbody.querySelectorAll(".ao-tracking-input").forEach((input) => {
      input.addEventListener("blur", async () => {
        const { error } = await supabaseClient.from("orders").update({ tracking_number: input.value.trim() || null }).eq("id", input.dataset.id);
        if (error) { alert("Couldn't save tracking number — please try again."); console.error(error); }
      });
    });
  }
</script>
