<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Molly Samuels</title>
<meta name="description" content="Create a Molly Samuels account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-split">
  <div class="auth-visual">
    <img src="assets/images/hero-main-2.jpg" alt="Molly Samuels">
    <div class="auth-visual-content">
      <h2>Join Molly Samuels.</h2>
      <p>Create an account to shop Mollys and M. Samuels in one place — track orders, save favourites, and check out faster.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-wrap">
      <a href="index.html" class="logo-mark">Molly <span>Samuels</span></a>
      <h1>Create account</h1>
      <p class="auth-sub">Join Molly Samuels — shop Mollys and M. Samuels in one place.</p>
      <p id="regError" style="display:none;color:#B23A3A;font-size:0.85rem;margin-bottom:16px;"></p>
      <form id="registerForm">
        <div class="auth-field">
          <label for="regName">Full name</label>
          <input type="text" id="regName" required>
        </div>
        <div class="auth-field">
          <label for="regEmail">Email address</label>
          <input type="email" id="regEmail" required>
        </div>
        <div class="auth-field">
          <label for="regPhone">Phone number</label>
          <input type="tel" id="regPhone" required>
        </div>
        <div class="auth-field">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" required minlength="6">
        </div>
        <div class="auth-field">
          <label for="regConfirm">Confirm password</label>
          <input type="password" id="regConfirm" required>
        </div>
        <button type="submit" class="btn btn-gold auth-submit" id="regBtn">Create Account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html" id="loginLink">Log in</a></p>
    </div>
  </div>
</div>

<!-- Supabase client — replace the two placeholder values below with your own
     Project URL and anon public key from Settings > Data API before uploading. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const supabaseClient = supabase.createClient(
    "https://vdlwnflklclenavtpamp.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkbHduZmxrbGNsZW5hdnRwYW1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTg5NTksImV4cCI6MjEwNTU3NDk1OX0.OfZ8QHqzaRepBc6pghvK6fbH1N6TqsD5AS4370CaBfU"
  );

  const redirectParam = new URLSearchParams(window.location.search).get("redirect");
  if (redirectParam) {
    document.getElementById("loginLink").href = `login.html?redirect=${encodeURIComponent(redirectParam)}`;
  }

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("regError");
    const btn = document.getElementById("regBtn");
    errorEl.style.display = "none";

    const name = document.getElementById("regName").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const password = document.getElementById("regPassword").value;
    const confirm = document.getElementById("regConfirm").value;

    if (password !== confirm) {
      errorEl.textContent = "Passwords don't match.";
      errorEl.style.display = "block";
      return;
    }

    btn.textContent = "Creating account...";
    btn.disabled = true;

    const { data, error } = await supabaseClient.auth.signUp({ email, password });

    if (error) {
      console.error("Supabase signUp error:", error);
      errorEl.textContent = error.message.includes("already registered")
        ? "An account already exists with this email."
        : `Something went wrong: ${error.message}`;
      errorEl.style.display = "block";
      btn.textContent = "Create Account";
      btn.disabled = false;
      return;
    }

    // Save the extra profile info (name, phone) alongside the new login.
    if (data.user) {
      await supabaseClient.from("customers").insert({
        id: data.user.id,
        full_name: name,
        phone: phone,
      });
    }

    // If email confirmation is required, there's no real session yet —
    // sending them to a protected page now would just look broken.
    if (!data.session) {
      errorEl.style.color = "#2D6B3B";
      errorEl.textContent = "Account created! Please check your email and click the confirmation link before logging in.";
      errorEl.style.display = "block";
      btn.textContent = "Create Account";
      btn.disabled = false;
      return;
    }

    window.location.href = new URLSearchParams(window.location.search).get("redirect") || "index.html";
  });
</script>
</body>
</html>
