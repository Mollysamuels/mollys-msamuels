<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Molly Samuels</title>
<meta name="description" content="Log in to your Molly Samuels account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-split">
  <div class="auth-visual">
    <img src="assets/images/hero-main-1.jpg" alt="Molly Samuels">
    <div class="auth-visual-content">
      <h2>Welcome back.</h2>
      <p>Sign in to track orders, save favourites, and check out faster across Mollys and M. Samuels.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-wrap">
      <a href="index.html" class="logo-mark">Molly <span>Samuels</span></a>
      <h1>Log in</h1>
      <p class="auth-sub">Access your Molly Samuels account.</p>
      <p id="loginError" style="display:none;color:#B23A3A;font-size:0.85rem;margin-bottom:16px;"></p>
      <form id="loginForm">
        <div class="auth-field">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="auth-field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <div class="auth-row-between">
          <label class="auth-checkbox"><input type="checkbox"> Remember me</label>
          <a href="reset-password.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-gold auth-submit" id="loginBtn">Log In</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="register.html" id="createAccountLink">Create one</a></p>
    </div>
  </div>
</div>

<!-- Supabase client — replace the two placeholder values below with your own
     Project URL and anon public key from Settings > Data API before uploading. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const supabaseClient = supabase.createClient(
    "https://vdlwnflklclenavtpamp.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkbHduZmxrbGNsZW5hdnRwYW1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTg5NTksImV4cCI6MjEwNTU3NDk1OX0.OfZ8QHqzaRepBc6pghvK6fbH1N6TqsD5AS4370CaBfU"
  );

  const redirectParam = new URLSearchParams(window.location.search).get("redirect");
  if (redirectParam) {
    document.getElementById("createAccountLink").href = `register.html?redirect=${encodeURIComponent(redirectParam)}`;
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {    e.preventDefault();
    const errorEl = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");
    errorEl.style.display = "none";
    btn.textContent = "Signing in...";
    btn.disabled = true;

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.textContent = error.message.includes("Email not confirmed")
        ? "Please confirm your email first — check your inbox for the confirmation link we sent."
        : "Incorrect email or password.";
      errorEl.style.display = "block";
      btn.textContent = "Log In";
      btn.disabled = false;
      return;
    }
    const redirect = new URLSearchParams(window.location.search).get("redirect");
    window.location.href = redirect || "account.html";
  });
</script>
</body>
</html>
