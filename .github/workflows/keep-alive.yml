# Keeps your Supabase database awake.
# Supabase's free plan pauses a project that gets no requests for 7 days. This asks your database
# for one tiny, public piece of information every Monday, Wednesday and Friday, so it never goes quiet.
# If Supabase ever fails to answer, this run is marked failed and GitHub emails you.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * 1,3,5"   # 06:17 UTC on Mon, Wed and Fri (the longest gap is 3 days)
  workflow_dispatch: {}          # also lets you press "Run workflow" by hand

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for one row
        run: |
          URL="${SUPABASE_URL:-https://vdlwnflklclenavtpamp.supabase.co}"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkbHduZmxrbGNsZW5hdnRwYW1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTg5NTksImV4cCI6MjEwNTU3NDk1OX0.OfZ8QHqzaRepBc6pghvK6fbH1N6TqsD5AS4370CaBfU"
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true)
          echo "Supabase answered with HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer normally (status: $status). The project may be paused: open the Supabase dashboard and press Restore."
            exit 1
          fi
