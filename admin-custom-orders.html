<div class="admin-content">
  <div class="admin-panel">
    <div class="admin-panel-head"><h2>Custom Uniform Requests</h2></div>
    <table class="admin-table">
      <tr><th>Organisation</th><th>Contact</th><th>Type</th><th>Quantity</th><th>Required Date</th><th>Status</th><th></th></tr>
      <tbody id="coRows"><tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:30px;">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="admin-panel">
    <div class="admin-panel-head"><h2>Bulk Pricing Enquiries</h2></div>
    <table class="admin-table">
      <tr><th>Product</th><th>Organisation</th><th>Quantity</th><th>Contact</th><th>Status</th><th></th></tr>
      <tbody id="boRows"><tr><td colspan="6" style="text-align:center;color:var(--ink-soft);padding:30px;">Loading…</td></tr></tbody>
    </table>
  </div>
</div>
</main>
</div>
<script>
  // Anything that came from the database is turned into plain text before it is
  // placed on the page, so a customer-typed name can never run as code.
  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const REQ_STATUS = ["new", "processing", "quoted", "closed"];

  document.addEventListener("adminReady", async () => {
    loadCustomOrders();
    loadBulkOrders();
  });

  async function loadCustomOrders() {
    const { data, error } = await supabaseClient.from("custom_order_requests").select("*").order("created_at", { ascending: false });
    const tbody = document.getElementById("coRows");
    if (error) { tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#B23A3A;padding:30px;">Couldn't load requests.</td></tr>`; console.error(error); return; }
    if (!data || !data.length) { tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:30px;">No custom order requests yet.</td></tr>`; return; }
    tbody.innerHTML = data.map((r) => `
      <tr>
        <td>${esc(r.organisation_name)}</td>
        <td>${esc(r.contact_person || "—")}</td>
        <td>${esc(r.organisation_type || "—")}</td>
        <td>${esc(r.quantity || "—")}</td>
        <td>${r.required_date ? new Date(r.required_date).toLocaleDateString() : "—"}</td>
        <td><select class="co-status" data-id="${esc(r.id)}" data-table="custom_order_requests" style="padding:4px 8px;border-radius:20px;border:1px solid var(--line);font-size:0.78rem;">${REQ_STATUS.map((s) => `<option value="${s}" ${s === r.status ? "selected" : ""}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join("")}</select></td>
        <td></td>
      </tr>`).join("");
    wireStatusSelects();
  }

  async function loadBulkOrders() {
    const { data, error } = await supabaseClient.from("bulk_order_requests").select("*").order("created_at", { ascending: false });
    const tbody = document.getElementById("boRows");
    if (error) { tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#B23A3A;padding:30px;">Couldn't load enquiries.</td></tr>`; console.error(error); return; }
    if (!data || !data.length) { tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--ink-soft);padding:30px;">No bulk pricing enquiries yet.</td></tr>`; return; }
    tbody.innerHTML = data.map((r) => `
      <tr>
        <td>${esc(r.product_name || "—")}</td>
        <td>${esc(r.organisation || "—")}</td>
        <td>${esc(r.quantity || "—")}</td>
        <td>${esc(r.contact_info || "—")}</td>
        <td><select class="co-status" data-id="${esc(r.id)}" data-table="bulk_order_requests" style="padding:4px 8px;border-radius:20px;border:1px solid var(--line);font-size:0.78rem;">${REQ_STATUS.map((s) => `<option value="${s}" ${s === r.status ? "selected" : ""}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join("")}</select></td>
        <td></td>
      </tr>`).join("");
    wireStatusSelects();
  }

  function wireStatusSelects() {
    document.querySelectorAll(".co-status").forEach((sel) => {
      if (sel.dataset.wired) return;
      sel.dataset.wired = "1";
      sel.addEventListener("change", async () => {
        const { error } = await supabaseClient.from(sel.dataset.table).update({ status: sel.value }).eq("id", sel.dataset.id);
        if (error) { alert("Couldn't update status."); console.error(error); }
      });
    });
  }
</script>
