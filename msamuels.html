<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M. Samuels — Schoolwear You Can Trust</title>
<meta name="description" content="M. Samuels — school uniforms for boys and girls, accessories and bespoke uniform solutions.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/msamuels.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="ms-body">

<!-- ============ MS HEADER (floats over hero) ============ -->
<header class="ms-header">
  <div class="ms-logo-stack">
    <a href="msamuels.html" class="ms-logo-img">
      <img src="assets/images/msamuels/logo.png" alt="M. Samuels">
    </a>
    <span class="ms-tagline">Schoolwear You Can Trust</span>
  </div>

  <div class="ms-header-actions">
    <button class="ms-action-btn" type="button" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      SEARCH
    </button>
    <a class="ms-action-btn" href="login.html">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.6-3.6 4.4-5.5 7.5-5.5s5.9 1.9 7.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      LOGIN /<br>REGISTER
    </a>
    <button class="ms-menu-btn" type="button" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<!-- ============ MS HERO ============ -->
<section class="ms-hero">
  <!-- Hero background: 5 images crossfading continuously in an endless loop.
       Upload your 5 images to assets/images/msamuels/hero/ named exactly
       hero-1.jpg through hero-5.jpg — nothing else needs to change.
       Never use GitHub's pencil/edit icon on these files — upload/delete-and-reupload only. -->
  <img class="ms-hero-bg active" src="assets/images/msamuels/hero/hero-1.jpg" alt="M. Samuels schoolwear">
  <img class="ms-hero-bg" src="assets/images/msamuels/hero/hero-2.jpg" alt="">
  <img class="ms-hero-bg" src="assets/images/msamuels/hero/hero-3.jpg" alt="">
  <img class="ms-hero-bg" src="assets/images/msamuels/hero/hero-4.jpg" alt="">
  <img class="ms-hero-bg" src="assets/images/msamuels/hero/hero-5.jpg" alt="">
  <div class="ms-hero-content">
    <h1>Schoolwear You Can Trust</h1>
    <div class="ms-hero-ctas">
      <a href="about.html" class="btn-ms-outline">About Us</a>
      <a href="shop.html" class="btn-ms-outline">View Catalogue</a>
    </div>
  </div>
</section>

<!-- ============ MEGA MENU OVERLAY ============ -->
<div class="ms-mega-overlay">
  <div class="ms-menu-panel">
    <button class="ms-mega-close" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>

    <div class="ms-mega-inner">

      <div class="ms-mega-tabs">
        <button class="ms-tab" data-tab="boys">
          <svg viewBox="0 0 40 40"></svg>
          boys school<br>uniform
        </button>
        <button class="ms-tab" data-tab="girls">
          <svg viewBox="0 0 40 40"></svg>
          girls school<br>uniform
        </button>
        <button class="ms-tab" data-tab="accessories">
          <svg viewBox="0 0 40 40"></svg>
          school uniform<br>accessories
        </button>
        <button class="ms-tab" data-tab="bespoke">
          <svg viewBox="0 0 40 40"></svg>
          bespoke school<br>uniform
        </button>
      </div>

      <div class="ms-mega-footer">
        <a href="about.html">about us</a>
        <a href="#">embroidery &amp; printing</a>
        <a href="#">solution to the pollution</a>
        <a href="size-guide.html">size guides</a>
        <a href="#">ethical trading policy</a>
        <a href="contact.html">contact us</a>
      </div>

      <div class="ms-mega-auth">
        <a href="register.html" class="register">REGISTER</a>
        <a href="login.html" class="login">LOGIN</a>
      </div>

    </div>
  </div>
</div>

<script src="js/msamuels.js"></script>
</body>
</html>
